name: pymarc version compatibility tests
on: 
  push: 
    branches:
      - main
      - "releases/**"      
  pull_request:
    branches:
      - main
      - "releases/**"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}  
      - name: Run tests
        run: uv run --with "pymarc==5.0.0" python -m pytest tests/test_pymarc_backwards_compatibility.py